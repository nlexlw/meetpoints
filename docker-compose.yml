services:
  backend:
    build:
      context: ./backend
    container_name: meetings_backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: meetings_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend